<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Storyline — overlay de atividade pro seu story</title>
  <meta name="description" content="Importe a atividade do Strava ou solte um GPX, escolha um tema e baixe a imagem pronta pro Instagram." />
  <link rel="canonical" href="https://storyline.fmeira.dev/" />
  <meta name="theme-color" content="#edefec" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Prévia de link. Fica em pt-BR e não acompanha a troca de idioma: quem lê
       isto é o robô da rede social, que não roda o JS que reescreve o título.
       As imagens são absolutas porque o crawler não resolve caminho relativo. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://storyline.fmeira.dev/" />
  <meta property="og:site_name" content="Storyline" />
  <meta property="og:title" content="Storyline — overlay de atividade pro seu story" />
  <meta property="og:description" content="Importe a atividade do Strava ou solte um GPX, escolha um tema e baixe a imagem pronta pro Instagram." />
  <meta property="og:image" content="https://storyline.fmeira.dev/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Storyline: um traçado de rota laranja sobre papel, com a distância ao lado." />
  <meta property="og:locale" content="pt_BR" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Lora:ital,wght@0,600;1,600&family=Caveat:wght@600&family=Fredoka:wght@500;700&family=Baloo+2:wght@600;800&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
